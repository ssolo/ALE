[workspace]
name = "ale"
version = "0.1.0"
description = "ALE: Amalgamated Likelihood Estimation for reconciled gene trees"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
cmake = ">=3.24"
openmpi = "*"
gxx = "*"
make = "*"
git = "*"
python = ">=3.10"
scipy = "*"
numpy = "*"
pytest = "*"

[tasks]
configure = "cmake -S . -B build"
build = { cmd = "cmake --build build -j4", depends-on = ["configure"] }
python_ale = "python -m ALE_python"
test = "pytest ALE_python/tests -v"
test-fast = "pytest ALE_python/tests -v -m 'not slow'"
